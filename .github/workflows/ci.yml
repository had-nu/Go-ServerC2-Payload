name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test (go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', '1.25', '1.26']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: check the module files
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: check the formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test with the race detector
        run: go test -race -count=1 ./...

      - name: check the documents against the ASD-STE100 rules
        run: go run ./tools/stelint README.md docs/*.md CODE_OF_CONDUCT.md

      - name: report the coverage
        run: |
          go test -coverprofile=coverage.out ./internal/... > /dev/null
          go tool cover -func=coverage.out | tail -1

  security:
    name: security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-dir=lab -fmt=json ./... > gosec.json || true
          cat gosec.json

  build-lab:
    name: build the lab Beacon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: build the published programs
        run: |
          go build -o bin/team-server ./cmd/team-server
          go build -o bin/beacon-stub ./cmd/beacon
          go build -ldflags="-s -w" -o bin/beacon ./lab/beacon-impl

      - name: confirm that the interface beacon runs no task
        run: |
          set -e
          out=$(./bin/beacon-stub)
          echo "$out"
          if echo "$out" | grep -q 'interface stub'; then
            echo "OK: cmd/beacon is the interface stub"
          else
            echo "FAIL: cmd/beacon is not the stub"
            exit 1
          fi
